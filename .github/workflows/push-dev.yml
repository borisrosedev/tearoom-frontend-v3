name: Push-Dev WF
run-name: ${{ github.actor }} is using the push-dev workflow 🚀
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]
  page_build:
jobs:
  Init-Job:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "GITHUB EVENT-NAME : ${{ github.event_name }} event."
      - run: |
          echo "JOB RUNNING ON A ${{ runner.os }} SERVER HOSTED BY GH"
      - run: |
          echo "BRANCH ${{ github.ref }} / REPOSITORY: ${{ github.repository }}."
      - run: |
          echo "This job's status is ${{ job.status }}."
  Node-Job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    steps:
      - name: Copy the repo
        uses: actions/checkout@v4
      - run: |
          echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version}}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run test 
        run: npm test
