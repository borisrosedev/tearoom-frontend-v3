services:
  web:
    build: .
    # command: npm start
    ports:
      - 127.0.0.1:8080:8080
    develop:
      watch:
        - action: sync+restart
          path: .
          target: .
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
